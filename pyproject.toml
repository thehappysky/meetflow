[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meetflow"
version = "0.1.0"
description = "Evidence-based meeting collaboration with bounded multi-agent workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.6,<3", "python-multipart>=0.0.20", "tzdata>=2025.1",
  "httpx>=0.28,<1", "langgraph==1.2.16", "langgraph-checkpoint-sqlite==3.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12"]
audio = ["faster-whisper>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

