name: checks
on:
  push:
    paths: ['backend/**', 'frontend/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'requirements.lock', '.github/workflows/ci.yml', 'labs/framework_spike/**']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'requirements.lock', '.github/workflows/ci.yml', 'labs/framework_spike/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Backend checks
        run: |
          python -m ruff check backend tests scripts/smoke_browser.py
          python -m pytest -q
          python labs/framework_spike/verify_runtime.py
      - name: Build web
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Browser journey
        env:
          MEETFLOW_DATA_DIR: ${{ runner.temp }}/meetflow-browser-data
        run: |
          python -m playwright install --with-deps chromium
          python -m uvicorn meetflow.api:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/meetflow-server.log" 2>&1 &
          python -c "import time,httpx; exec('for i in range(30):\n try:\n  r=httpx.get(\"http://127.0.0.1:8765/api/health\"); r.raise_for_status(); break\n except Exception:\n  time.sleep(1)\nelse: raise SystemExit(\"server not ready\")')"
          python scripts/smoke_browser.py --channel chromium
