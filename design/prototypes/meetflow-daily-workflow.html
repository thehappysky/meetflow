&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {

        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

      throw new Error(`Missing ${property} getter`);

    return getter;

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      nextState,

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

        if (typeof callback !== &quot;function&quot;) {

        }

        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }

                pendingStateWrites.delete(id);

        ]);

        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }

    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }

    const href = link?.getAttribute(&quot;href&quot;);

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

  const stateDesign={comfortable:true};
  function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{role,screen:view},privateContent:{reportConfirmed}}).catch(()=&gt;{});}

  function details(central){const r=central?snap(activeId):record(activeId);if(!r||(!central&amp;&amp;r.deleted))return heading(&#x27;记录暂不可用&#x27;,&#x27;中心可能已撤下该记录。&#x27;,button(&#x27;返回列表&#x27;,role===&#x27;sales&#x27;?&#x27;submitted&#x27;:&#x27;center-records&#x27;));return `&lt;button class=&quot;mf-link mf-back&quot; data-act=&quot;${central?(role===&#x27;sales&#x27;?&#x27;submitted&#x27;:&#x27;center-records&#x27;):&#x27;calls&#x27;}&quot;&gt;← 返回${central?&#x27;中心记录&#x27;:&#x27;我的录音&#x27;}&lt;/button&gt;`+heading(esc(r.title),`${central?&#x27;中心证据 v&#x27;+r.rev:&#x27;仅自己可见&#x27;} · 会谈日期：${r.date||&#x27;待确认&#x27;}`,!central?button(&#x27;修改名称与日期&#x27;,&#x27;edit&#x27;,r.id):&#x27;&#x27;)+`&lt;div class=&quot;mf-split&quot;&gt;&lt;section class=&quot;mf-paper&quot;&gt;&lt;div class=&quot;mf-tabs&quot;&gt;${[[&#x27;minutes&#x27;,&#x27;纪要&#x27;],[&#x27;promises&#x27;,&#x27;后续事项&#x27;],[&#x27;quality&#x27;,&#x27;复盘建议&#x27;]].map(([v,t])=&gt;`&lt;button aria-pressed=&quot;${detailTab===v}&quot; data-act=&quot;tab&quot; data-id=&quot;${v}&quot;&gt;${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${detailTab===&#x27;minutes&#x27;?`&lt;h2&gt;先看本次谈到的重点&lt;/h2&gt;&lt;p&gt;${esc(r.topic)}&lt;/p&gt;&lt;h3&gt;下一步&lt;/h3&gt;&lt;p&gt;${esc(r.promise)}&lt;/p&gt;&lt;button class=&quot;mf-link mf-cite&quot; data-act=&quot;evidence&quot;&gt;查看原文依据 ↗&lt;/button&gt;`:detailTab===&#x27;promises&#x27;?`&lt;h2&gt;后续事项已整理&lt;/h2&gt;&lt;p&gt;${esc(r.promise)}&lt;/p&gt;&lt;div class=&quot;mf-note mf-warn&quot;&gt;时间未约定，保留“待确认”；没有生成虚构截止日期。&lt;/div&gt;&lt;button class=&quot;mf-link&quot; data-act=&quot;promise-done&quot;&gt;标记自己的准备工作已完成&lt;/button&gt;`:`&lt;h2&gt;本次值得复盘的地方&lt;/h2&gt;&lt;h3&gt;做对：识别客户下一步参与者&lt;/h3&gt;&lt;p&gt;客户提出由技术负责人参会，应保留这项明确要求。&lt;/p&gt;&lt;h3&gt;待补：演示时间还未约定&lt;/h3&gt;&lt;p&gt;记录等待条件，不把单方提出安排当作双方已确认。&lt;/p&gt;&lt;small&gt;示例判断 · 正式评分将使用企业培训规则与原文依据。&lt;/small&gt;`}${evidence?`&lt;section class=&quot;mf-evidence&quot; aria-label=&quot;原文示例&quot;&gt;&lt;small&gt;原文示例 · 此原型不播放真实录音&lt;/small&gt;&lt;blockquote&gt;销售：我先准备演示资料。&lt;br&gt;客户：技术同事需要一起参加，具体日期我再确认。&lt;/blockquote&gt;&lt;small&gt;引用：本次录音 00:12—00:24&lt;/small&gt;&lt;/section&gt;`:&#x27;&#x27;}&lt;/section&gt;&lt;aside&gt;&lt;div class=&quot;mf-note&quot;&gt;${central?&#x27;上报版本独立保存。个人区删改不会覆盖这里的依据。&#x27;:&#x27;已自动保存，你可以随时离开。无需再逐项批准纪要。&#x27;}&lt;/div&gt;&lt;div class=&quot;mf-paper&quot;&gt;&lt;h3&gt;会谈信息&lt;/h3&gt;&lt;div class=&quot;mf-meta&quot;&gt;&lt;span&gt;销售：小林 · 企业服务一组&lt;/span&gt;&lt;span&gt;客户／商机：${esc(r.customer||&#x27;待归属&#x27;)}&lt;/span&gt;&lt;span&gt;实际日期：${r.date||&#x27;待确认&#x27;}&lt;/span&gt;&lt;span&gt;上传时间：${r.upload}&lt;/span&gt;${central?`&lt;span&gt;上报时间：${r.submitted}&lt;/span&gt;`:&#x27;&#x27;}&lt;/div&gt;${!central?button(&#x27;加入工作简报&#x27;,&#x27;report&#x27;,&#x27;&#x27;,true):role===&#x27;sales&#x27;?button(&#x27;申请更正中心记录&#x27;,&#x27;request&#x27;,r.id):role===&#x27;manager&#x27;?button(&#x27;撤下中心记录&#x27;,&#x27;remove-center&#x27;,r.id):&#x27;&#x27;}&lt;/div&gt;${!central&amp;&amp;snap(r.id)?`&lt;div class=&quot;mf-note&quot;&gt;中心保留上报版本 v${snap(r.id).rev}。个人区修改后，需要申请更正才能更新中心。&lt;br&gt;&lt;button class=&quot;mf-link&quot; data-act=&quot;request&quot; data-id=&quot;${r.id}&quot;&gt;申请更正中心记录&lt;/button&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;/aside&gt;&lt;/div&gt;`;}
  function editing(isRequest){const r=record(activeId)||snap(activeId),s=snap(activeId);return `&lt;button class=&quot;mf-link mf-back&quot; data-act=&quot;${isRequest?&#x27;submitted&#x27;:&#x27;calls&#x27;}&quot;&gt;← 返回&lt;/button&gt;`+heading(isRequest?&#x27;申请更正中心记录&#x27;:&#x27;补充会谈信息&#x27;,isRequest?`主管确认后发布中心 v${s?s.rev+1:2}，当前中心内容不会立即改变。`:&#x27;只修改你的个人工作区，上传时间和中心证据保持不变。&#x27;)+`&lt;form id=&quot;mf-edit&quot; class=&quot;mf-paper&quot; style=&quot;max-width:660px&quot;&gt;&lt;label class=&quot;mf-field&quot;&gt;录音名称&lt;input name=&quot;title&quot; value=&quot;${esc(r.title)}&quot; required&gt;&lt;/label&gt;&lt;label class=&quot;mf-field&quot;&gt;实际会议日期（可留空）&lt;input name=&quot;date&quot; type=&quot;date&quot; value=&quot;${r.date}&quot;&gt;&lt;/label&gt;&lt;label class=&quot;mf-field&quot;&gt;客户／商机&lt;input name=&quot;customer&quot; value=&quot;${esc(r.customer)}&quot; placeholder=&quot;不确定可以先留空&quot;&gt;&lt;/label&gt;${isRequest?&#x27;&lt;label class=&quot;mf-field&quot;&gt;更正原因&lt;textarea name=&quot;reason&quot; required placeholder=&quot;说明哪项需要修正，以及为什么&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&#x27;:&#x27;&#x27;}&lt;button class=&quot;mf-button mf-primary&quot; type=&quot;button&quot; data-act=&quot;save-edit&quot;&gt;${isRequest?&#x27;发送更正申请&#x27;:&#x27;保存个人修改&#x27;}&lt;/button&gt;&lt;/form&gt;`;}
  function submitting(){const picked=records.filter(r=&gt;selected.has(r.id)&amp;&amp;!r.deleted);return `&lt;button class=&quot;mf-link mf-back&quot; data-act=&quot;calls&quot;&gt;← 返回录音&lt;/button&gt;`+heading(&#x27;确认这次上报的范围&#x27;,`仅上报选中的 ${picked.length} 场。录音和当前纪要将进入团队中心。`)+`&lt;form id=&quot;mf-submit&quot; class=&quot;mf-paper&quot;&gt;${picked.map(r=&gt;`&lt;section class=&quot;mf-issue&quot;&gt;&lt;h3&gt;${esc(r.title)}&lt;/h3&gt;&lt;small&gt;会谈日期：${r.date||&#x27;待确认&#x27;} · 上传：${r.upload}&lt;/small&gt;${r.customer?`&lt;p&gt;客户／商机：${esc(r.customer)}&lt;/p&gt;`:`&lt;label class=&quot;mf-field&quot;&gt;这场属于哪个客户／商机？&lt;select name=&quot;customer-${r.id}&quot; required aria-label=&quot;${esc(r.title)} 客户归属&quot;&gt;&lt;option value=&quot;&quot;&gt;只需在上报时补选&lt;/option&gt;&lt;option&gt;星河制造 · 采购协作项目&lt;/option&gt;&lt;option&gt;海川科技 · 报表平台项目&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;small&gt;只在上报前补选一次，确保团队能串联客户进展；上传不受此限制。&lt;/small&gt;`}&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;label class=&quot;mf-checkline&quot;&gt;&lt;input name=&quot;ack&quot; type=&quot;checkbox&quot; required&gt;&lt;span&gt;确认上报以上录音及关联依据，主管可查看团队资料，老板可查看公司资料。&lt;/span&gt;&lt;/label&gt;&lt;button class=&quot;mf-button mf-primary&quot; type=&quot;button&quot; data-act=&quot;finish-submit&quot;&gt;确认上报 ${picked.length} 场&lt;/button&gt;&lt;/form&gt;`;}
  function report(){const pending=reportConfirmed&amp;&amp;frozenReport?frozenReport.pending:records.filter(r=&gt;!r.deleted&amp;&amp;!r.date);return heading(&#x27;把本周记录，变成可以交付的简报&#x27;,&#x27;11月9日—11月15日 · 企业服务销售周报模板&#x27;,reportConfirmed?`&lt;div class=&quot;mf-actions&quot;&gt;${button(&#x27;预览 Word 版&#x27;,&#x27;word&#x27;)}${button(&#x27;预览 PDF 版&#x27;,&#x27;pdf&#x27;)}${button(&#x27;修订为新草稿&#x27;,&#x27;new-report&#x27;)}&lt;/div&gt;`:button(&#x27;确认并生成&#x27;,&#x27;confirm-report&#x27;,&#x27;&#x27;,true))+`&lt;div class=&quot;mf-split&quot;&gt;&lt;article class=&quot;mf-paper&quot;&gt;&lt;div class=&quot;mf-report-head&quot;&gt;&lt;div class=&quot;mf-kicker&quot;&gt;weekly brief · 示例&lt;/div&gt;&lt;h2&gt;本周工作简报&lt;/h2&gt;&lt;p&gt;小林 · 企业服务一组&lt;/p&gt;&lt;small&gt;${reportConfirmed?&#x27;已确认版本 v&#x27;+reportVersion:&#x27;草稿 · 可直接修改以下内容&#x27;}&lt;/small&gt;&lt;/div&gt;&lt;h3&gt;一、本周客户推进&lt;/h3&gt;&lt;textarea id=&quot;mf-report-text&quot; class=&quot;mf-report-edit&quot; aria-label=&quot;本周客户推进&quot; ${reportConfirmed?&#x27;readonly&#x27;:&#x27;&#x27;}&gt;${esc(reportText)}&lt;/textarea&gt;${record(&#x27;a&#x27;).deleted?&#x27;&lt;small&gt;来源已删除，已确认报告保留原内容。&lt;/small&gt;&#x27;:&#x27;&lt;button class=&quot;mf-link mf-cite&quot; data-act=&quot;source&quot;&gt;来源：星河制造会谈 ↗&lt;/button&gt;&#x27;}&lt;h3&gt;二、后续安排&lt;/h3&gt;&lt;p&gt;准备产品演示资料；等待客户确认技术参会人员及日期。&lt;/p&gt;&lt;h3&gt;三、时间待确认的记录&lt;/h3&gt;${pending.length?pending.map(r=&gt;`&lt;p&gt;${esc(r.title)}：${esc(r.topic)}&lt;/p&gt;`).join(&#x27;&#x27;):&#x27;&lt;p&gt;本周记录的会议日期均已补充。&lt;/p&gt;&#x27;}&lt;small&gt;日期未知的记录单列，不计入已确定的本周会谈数量。&lt;/small&gt;&lt;h3&gt;四、需协助事项&lt;/h3&gt;&lt;p&gt;后续演示可能需要技术同事支持，具体参与安排待确认。&lt;/p&gt;&lt;/article&gt;&lt;aside&gt;&lt;div class=&quot;mf-paper&quot;&gt;&lt;h3&gt;${reportConfirmed?&#x27;报告已确认&#x27;:&#x27;只处理缺少的信息&#x27;}&lt;/h3&gt;${reportConfirmed?&#x27;&lt;p&gt;Word 和 PDF 使用同一份确认内容。此原型只预览版式，不生成正式文件。&lt;/p&gt;&#x27;:`&lt;p&gt;已用你的会谈和后续事项填入模板，不用重新写一遍。&lt;/p&gt;${pending.map(r=&gt;`&lt;label
