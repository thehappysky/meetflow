<style>
#mf-daily{--mf-bg:light-dark(#f3f4f0,#121918);--mf-paper:light-dark(#fff,#1b2421);--mf-ink:light-dark(#203b33,#e1eae5);--mf-muted:light-dark(#64756e,#abbdb3);--mf-line:light-dark(#dce3dd,#35463b);--mf-soft:light-dark(#e7eee7,#253b2b);--mf-accent:light-dark(#225e47,#a4d5b3);--mf-on:light-dark(#fff,#14271b);--mf-warn:light-dark(#faf0d9,#42351a);--mf-warn-ink:light-dark(#725319,#ebd29a);color:var(--mf-ink);font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif;width:100%;color-scheme:light dark}
#mf-daily *{box-sizing:border-box}#mf-daily [hidden]{display:none!important}#mf-daily button,#mf-daily input,#mf-daily select,#mf-daily textarea{font:inherit;color:inherit}#mf-daily button{cursor:var(--cursor-interaction,pointer)}#mf-daily button:disabled{opacity:.48;cursor:default}#mf-daily h1,#mf-daily h2,#mf-daily h3,#mf-daily p{margin:0}#mf-daily h1{font-size:28px;line-height:1.35;font-weight:600;letter-spacing:-.7px}#mf-daily h2{font-size:19px;font-weight:600}#mf-daily h3{font-size:15px;font-weight:600}#mf-daily small,#mf-daily .mf-muted{color:var(--mf-muted)}#mf-daily small{font-size:12px}#mf-daily .mf-review{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 16px;font-size:12px}#mf-daily select,#mf-daily input:not([type=checkbox]),#mf-daily textarea{background:var(--mf-paper);border:1px solid var(--mf-line);border-radius:6px;padding:8px 10px;max-width:100%;min-width:0}#mf-daily select{margin-left:6px}#mf-daily .mf-app{background:var(--mf-bg);border:1px solid var(--mf-line);border-radius:12px;overflow:clip;min-height:790px}#mf-daily .mf-header{background:var(--mf-paper);display:flex;align-items:center;gap:22px;padding:18px 28px;border-bottom:1px solid var(--mf-line);flex-wrap:wrap}#mf-daily .mf-brand{display:flex;align-items:center;gap:9px;font-size:19px;letter-spacing:-.5px}#mf-daily .mf-logo{display:grid;place-items:center;background:var(--mf-accent);color:var(--mf-on);width:29px;height:29px;border-radius:7px;font-size:16px;font-weight:600}#mf-daily nav{display:flex;gap:8px;flex-wrap:wrap}#mf-daily nav button{border:0;background:none;padding:7px 10px;border-radius:6px;color:var(--mf-muted)}#mf-daily nav button[aria-current=page]{background:var(--mf-soft);color:var(--mf-ink)}#mf-daily .mf-account{margin-left:auto;font-size:12px;color:var(--mf-muted)}#mf-daily main{padding:30px;min-height:620px}#mf-daily .mf-title{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}#mf-daily .mf-title p{color:var(--mf-muted);margin-top:8px}#mf-daily .mf-button{border:1px solid var(--mf-line);background:var(--mf-paper);padding:9px 15px;border-radius:7px;white-space:normal}#mf-daily .mf-primary{background:var(--mf-accent);border-color:var(--mf-accent);color:var(--mf-on)}#mf-daily .mf-link{border:0;background:none;color:var(--mf-accent);padding:3px 0;text-decoration:underline;text-underline-offset:3px}#mf-daily .mf-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#mf-daily .mf-drop{background:var(--mf-paper);border:1px dashed var(--mf-line);border-radius:9px;padding:24px;display:flex;align-items:center;gap:24px;justify-content:space-between;margin-bottom:28px}#mf-daily .mf-drop p{margin:4px 0 12px;color:var(--mf-muted)}#mf-daily .mf-drop label{display:inline-block}#mf-daily .mf-drop input[type=file]{width:100%;margin-top:12px;border:0;padding:0;font-size:12px}#mf-daily .mf-drop-copy{max-width:550px;min-width:0}#mf-daily .mf-icon{font-size:24px;background:var(--mf-soft);padding:10px 19px;border-radius:50%;font-weight:400}#mf-daily .mf-note{padding:12px 15px;background:var(--mf-soft);border-radius:7px;margin:16px 0;color:var(--mf-ink);font-size:13px}#mf-daily .mf-warn{background:var(--mf-warn);color:var(--mf-warn-ink)}#mf-daily .mf-notice{padding:12px 30px;background:var(--mf-soft);border-bottom:1px solid var(--mf-line);font-size:13px}#mf-daily .mf-sectionline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0 10px}#mf-daily .mf-record{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:15px;padding:var(--mf-row-space,21px) 4px;border-bottom:1px solid var(--mf-line);align-items:start}#mf-daily .mf-record input[type=checkbox]{width:17px;height:17px;accent-color:var(--mf-accent);margin-top:6px}#mf-daily .mf-record h3 button{background:none;border:0;padding:0;text-align:left;font-weight:600}#mf-daily .mf-record p{font-size:13px;color:var(--mf-muted);margin-top:4px}#mf-daily .mf-tag{font-size:11px;border-radius:4px;background:var(--mf-soft);padding:2px 6px;display:inline-block;margin-left:7px;font-weight:400;color:var(--mf-ink)}#mf-daily .mf-record details{font-size:12px;margin-top:8px;color:var(--mf-muted)}#mf-daily .mf-record details button{margin-right:14px}#mf-daily .mf-split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(230px,1fr);gap:24px;align-items:start}#mf-daily .mf-paper{background:var(--mf-paper);border:1px solid var(--mf-line);border-radius:8px;padding:25px;min-width:0}#mf-daily .mf-paper p{margin:10px 0}#mf-daily .mf-paper h3{margin:22px 0 6px}#mf-daily .mf-paper h3:first-child{margin-top:0}#mf-daily .mf-kicker{font-size:11px;letter-spacing:1.3px;color:var(--mf-muted);text-transform:uppercase;margin-bottom:8px}#mf-daily .mf-back{margin-bottom:17px}#mf-daily .mf-tabs{display:flex;gap:18px;border-bottom:1px solid var(--mf-line);margin-bottom:20px;flex-wrap:wrap}#mf-daily .mf-tabs button{border:0;background:none;padding:10px 0;color:var(--mf-muted)}#mf-daily .mf-tabs button[aria-pressed=true]{color:var(--mf-accent);border-bottom:2px solid var(--mf-accent)}#mf-daily .mf-meta{display:grid;gap:7px;margin:16px 0;font-size:13px}#mf-daily .mf-field{display:grid;gap:5px;margin:15px 0;color:var(--mf-muted);font-size:13px}#mf-daily .mf-field textarea{min-height:100px;resize:vertical;width:100%;line-height:1.7}#mf-daily .mf-field input,#mf-daily .mf-field select{width:100%;margin:0}#mf-daily blockquote{border-left:3px solid var(--mf-line);padding-left:12px;margin:12px 0;color:var(--mf-muted)}#mf-daily .mf-cite{font-size:12px}#mf-daily .mf-report-head{text-align:center;margin-bottom:25px;border-bottom:1px solid var(--mf-line);padding-bottom:20px}#mf-daily .mf-report-head h2{font-size:25px;font-family:Georgia,"Songti SC",serif;font-weight:500}#mf-daily .mf-issue{padding:14px 0;border-bottom:1px solid var(--mf-line)}#mf-daily .mf-issue:last-child{border:0}#mf-daily .mf-issue small{display:block;margin:5px 0}#mf-daily .mf-empty{padding:45px 20px;background:var(--mf-paper);border-radius:8px;text-align:center;color:var(--mf-muted)}#mf-daily .mf-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 28px;font-size:11px;border-top:1px solid var(--mf-line);color:var(--mf-muted)}#mf-daily .mf-checkline{display:flex;gap:10px;align-items:start;margin:16px 0}#mf-daily .mf-checkline input{margin-top:6px;accent-color:var(--mf-accent)}#mf-daily .mf-time{font-variant-numeric:tabular-nums}#mf-daily .mf-count{font-size:13px;color:var(--mf-muted)}#mf-daily .mf-evidence{margin-top:18px;padding:15px;background:var(--mf-soft);border-radius:7px}#mf-daily .mf-report-edit{background:var(--mf-paper);border:0;border-bottom:1px dashed var(--mf-line);border-radius:0;padding:5px 0;resize:vertical;width:100%;line-height:1.8;min-height:88px}
@media(max-width:740px){#mf-daily .mf-split{grid-template-columns:minmax(0,1fr)}#mf-daily main{padding:22px}#mf-daily .mf-header{padding:16px 22px;gap:12px}#mf-daily .mf-account{margin-left:0}#mf-daily .mf-drop{padding:20px;gap:14px}#mf-daily h1{font-size:24px}#mf-daily .mf-icon{display:none}}
@media(max-width:440px){#mf-daily main{padding:18px 14px}#mf-daily .mf-header{padding:14px;gap:10px}#mf-daily .mf-account{width:100%}#mf-daily .mf-header nav{gap:3px}#mf-daily nav button{padding:7px}#mf-daily .mf-record{grid-template-columns:20px minmax(0,1fr);gap:8px}#mf-daily .mf-record>.mf-actions{grid-column:2}#mf-daily .mf-paper{padding:17px}#mf-daily .mf-drop{padding:17px}#mf-daily .mf-review{font-size:11px}#mf-daily .mf-review select{margin-left:0}#mf-daily input:not([type=checkbox]),#mf-daily textarea,#mf-daily select{font-size:16px}#mf-daily .mf-footer{padding:14px}#mf-daily h1{font-size:23px}#mf-daily .mf-button{padding:10px 13px}#mf-daily main{min-height:750px}}
</style>
<script>
(()=>{
  const root=document.getElementById('mf-daily'),screen=root.querySelector('#mf-screen'),roleInput=root.querySelector('#mf-role');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const button=(label,act,id='',primary=false)=>`<button class="mf-button ${primary?'mf-primary':''}" data-act="${act}" data-id="${id}">${label}</button>`;
  const seed=()=>[{id:'a',title:'星河制造 · 需求沟通',date:'2026-11-10',customer:'星河制造 · 采购协作项目',upload:'11月10日 16:20',topic:'客户确认需要技术负责人参加演示，具体时间待定。',promise:'我准备演示资料；客户确认技术参会人员。',deleted:false,version:1},{id:'b',title:'11月11日 下午上传的会议录音',date:'',customer:'',upload:'11月11日 14:32',topic:'讨论采购审批流程；对接人身份和会谈日期需要补充。',promise:'先发产品资料，演示日期尚未约定。',deleted:false,version:1}];
  let records=seed(),snapshots=[{...seed()[0],rev:1,submitted:'11月10日 17:00',removed:false}],requests=[],selected=new Set(),role='sales',view='calls',activeId='a',detailTab='minutes',evidence=false,reportConfirmed=false,reportDateAcknowledged=false,busy=false,reportText='星河制造确认了采购协作需求，希望技术负责人参加后续演示。演示日期仍待双方确认。',notice='',frozenReport=null,reportStale=false,reportVersion=0;
  const stateDesign={comfortable:true};
  function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{role,screen:view},privateContent:{reportConfirmed}}).catch(()=>{});}
  function announce(t){notice=t;const n=root.querySelector('#mf-notice');n.textContent=t;n.hidden=!t;}
  function record(id){return records.find(r=>r.id===id);}
  function snap(id){return snapshots.find(r=>r.id===id&&!r.removed);}
  function go(next,id){view=next;if(id)activeId=id;evidence=false;announce('');render();persist();}
  function labels(){return role==='sales'?[['calls','会谈录音'],['report','工作简报'],['submitted','已上报']]:role==='manager'?[['center','团队关注'],['center-records','中心会谈'],['review','更正申请']]:[['boss','公司简报'],['center-records','中心会谈']];}
  function heading(title,sub,action=''){return `<div class="mf-title"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`;}
  function row(r,central=false){return `<article class="mf-record">${!central?`<input type="checkbox" aria-label="选择 ${esc(r.title)}" data-select="${r.id}" ${selected.has(r.id)?'checked':''} ${busy?'disabled':''}>`:'<span class="mf-icon" style="font-size:15px;padding:4px 10px">↗</span>'}<div><h3><button data-act="${central?'central-detail':'detail'}" data-id="${r.id}">${esc(r.title)}</button>${central?`<span class="mf-tag">中心 v${r.rev}</span>`:snap(r.id)?'<span class="mf-tag">已上报</span>':'<span class="mf-tag">仅自己可见</span>'}</h3><p>${esc(r.topic)}</p><small>会谈：${r.date?esc(r.date):'日期待确认'} · ${central?'上报：'+r.submitted:'上传：'+r.upload}</small>${!central?`<details><summary>管理录音</summary><button class="mf-link" data-act="edit" data-id="${r.id}">修改名称与日期</button><button class="mf-link" data-act="delete" data-id="${r.id}">删除个人录音</button></details>`:''}</div><div class="mf-actions">${button('查看纪要',central?'central-detail':'detail',r.id)}</div></article>`;}
  function calls(){const visible=records.filter(r=>!r.deleted);return heading('小林的会谈','录音先留在这里。只有你确认上报的内容，才进入管理中心。')+`<section class="mf-drop" id="mf-drop"><div class="mf-drop-copy"><h2>把录音拖进来，剩下的交给系统</h2><p>不想填标题也可以。按上传时段命名，实际会谈日期保持待确认。</p><div class="mf-actions">${button(busy?'示例整理中…':'用示例录音体验上传','upload','',true)}</div><label><small>或选择本地录音（仅演示文件进入列表，不读取或转写内容）</small><input type="file" id="mf-file" accept="audio/*" aria-label="选择本地录音"></label></div><span class="mf-icon" aria-hidden="true">↑</span></section><div class="mf-sectionline"><h2>我的录音 <span class="mf-count">${visible.length} 场</span></h2><button class="mf-button mf-primary" data-act="submit" ${!selected.size||busy?'disabled':''}>上报所选${selected.size?' · '+selected.size+' 场':''}</button></div>${visible.length?visible.map(r=>row(r)).join(''):'<div class="mf-empty">个人区暂无录音。已有上报记录仍可在“已上报”中查看。</div>'}`;}
  function details(central){const r=central?snap(activeId):record(activeId);if(!r||(!central&&r.deleted))return heading('记录暂不可用','中心可能已撤下该记录。',button('返回列表',role==='sales'?'submitted':'center-records'));return `<button class="mf-link mf-back" data-act="${central?(role==='sales'?'submitted':'center-records'):'calls'}">← 返回${central?'中心记录':'我的录音'}</button>`+heading(esc(r.title),`${central?'中心证据 v'+r.rev:'仅自己可见'} · 会谈日期：${r.date||'待确认'}`,!central?button('修改名称与日期','edit',r.id):'')+`<div class="mf-split"><section class="mf-paper"><div class="mf-tabs">${[['minutes','纪要'],['promises','后续事项'],['quality','复盘建议']].map(([v,t])=>`<button aria-pressed="${detailTab===v}" data-act="tab" data-id="${v}">${t}</button>`).join('')}</div>${detailTab==='minutes'?`<h2>先看本次谈到的重点</h2><p>${esc(r.topic)}</p><h3>下一步</h3><p>${esc(r.promise)}</p><button class="mf-link mf-cite" data-act="evidence">查看原文依据 ↗</button>`:detailTab==='promises'?`<h2>后续事项已整理</h2><p>${esc(r.promise)}</p><div class="mf-note mf-warn">时间未约定，保留“待确认”；没有生成虚构截止日期。</div><button class="mf-link" data-act="promise-done">标记自己的准备工作已完成</button>`:`<h2>本次值得复盘的地方</h2><h3>做对：识别客户下一步参与者</h3><p>客户提出由技术负责人参会，应保留这项明确要求。</p><h3>待补：演示时间还未约定</h3><p>记录等待条件，不把单方提出安排当作双方已确认。</p><small>示例判断 · 正式评分将使用企业培训规则与原文依据。</small>`}${evidence?`<section class="mf-evidence" aria-label="原文示例"><small>原文示例 · 此原型不播放真实录音</small><blockquote>销售：我先准备演示资料。<br>客户：技术同事需要一起参加，具体日期我再确认。</blockquote><small>引用：本次录音 00:12—00:24</small></section>`:''}</section><aside><div class="mf-note">${central?'上报版本独立保存。个人区删改不会覆盖这里的依据。':'已自动保存，你可以随时离开。无需再逐项批准纪要。'}</div><div class="mf-paper"><h3>会谈信息</h3><div class="mf-meta"><span>销售：小林 · 企业服务一组</span><span>客户／商机：${esc(r.customer||'待归属')}</span><span>实际日期：${r.date||'待确认'}</span><span>上传时间：${r.upload}</span>${central?`<span>上报时间：${r.submitted}</span>`:''}</div>${!central?button('加入工作简报','report','',true):role==='sales'?button('申请更正中心记录','request',r.id):role==='manager'?button('撤下中心记录','remove-center',r.id):''}</div>${!central&&snap(r.id)?`<div class="mf-note">中心保留上报版本 v${snap(r.id).rev}。个人区修改后，需要申请更正才能更新中心。<br><button class="mf-link" data-act="request" data-id="${r.id}">申请更正中心记录</button></div>`:''}</aside></div>`;}
  function editing(isRequest){const r=record(activeId)||snap(activeId),s=snap(activeId);return `<button class="mf-link mf-back" data-act="${isRequest?'submitted':'calls'}">← 返回</button>`+heading(isRequest?'申请更正中心记录':'补充会谈信息',isRequest?`主管确认后发布中心 v${s?s.rev+1:2}，当前中心内容不会立即改变。`:'只修改你的个人工作区，上传时间和中心证据保持不变。')+`<form id="mf-edit" class="mf-paper" style="max-width:660px"><label class="mf-field">录音名称<input name="title" value="${esc(r.title)}" required></label><label class="mf-field">实际会议日期（可留空）<input name="date" type="date" value="${r.date}"></label><label class="mf-field">客户／商机<input name="customer" value="${esc(r.customer)}" placeholder="不确定可以先留空"></label>${isRequest?'<label class="mf-field">更正原因<textarea name="reason" required placeholder="说明哪项需要修正，以及为什么"></textarea></label>':''}<button class="mf-button mf-primary" type="button" data-act="save-edit">${isRequest?'发送更正申请':'保存个人修改'}</button></form>`;}
  function submitting(){const picked=records.filter(r=>selected.has(r.id)&&!r.deleted);return `<button class="mf-link mf-back" data-act="calls">← 返回录音</button>`+heading('确认这次上报的范围',`仅上报选中的 ${picked.length} 场。录音和当前纪要将进入团队中心。`)+`<form id="mf-submit" class="mf-paper">${picked.map(r=>`<section class="mf-issue"><h3>${esc(r.title)}</h3><small>会谈日期：${r.date||'待确认'} · 上传：${r.upload}</small>${r.customer?`<p>客户／商机：${esc(r.customer)}</p>`:`<label class="mf-field">这场属于哪个客户／商机？<select name="customer-${r.id}" required aria-label="${esc(r.title)} 客户归属"><option value="">只需在上报时补选</option><option>星河制造 · 采购协作项目</option><option>海川科技 · 报表平台项目</option></select></label><small>只在上报前补选一次，确保团队能串联客户进展；上传不受此限制。</small>`}</section>`).join('')}<label class="mf-checkline"><input name="ack" type="checkbox" required><span>确认上报以上录音及关联依据，主管可查看团队资料，老板可查看公司资料。</span></label><button class="mf-button mf-primary" type="button" data-act="finish-submit">确认上报 ${picked.length} 场</button></form>`;}
  function report(){const pending=reportConfirmed&&frozenReport?frozenReport.pending:records.filter(r=>!r.deleted&&!r.date);return heading('把本周记录，变成可以交付的简报','11月9日—11月15日 · 企业服务销售周报模板',reportConfirmed?`<div class="mf-actions">${button('预览 Word 版','word')}${button('预览 PDF 版','pdf')}${button('修订为新草稿','new-report')}</div>`:button('确认并生成','confirm-report','',true))+`<div class="mf-split"><article class="mf-paper"><div class="mf-report-head"><div class="mf-kicker">weekly brief · 示例</div><h2>本周工作简报</h2><p>小林 · 企业服务一组</p><small>${reportConfirmed?'已确认版本 v'+reportVersion:'草稿 · 可直接修改以下内容'}</small></div><h3>一、本周客户推进</h3><textarea id="mf-report-text" class="mf-report-edit" aria-label="本周客户推进" ${reportConfirmed?'readonly':''}>${esc(reportText)}</textarea>${record('a').deleted?'<small>来源已删除，已确认报告保留原内容。</small>':'<button class="mf-link mf-cite" data-act="source">来源：星河制造会谈 ↗</button>'}<h3>二、后续安排</h3><p>准备产品演示资料；等待客户确认技术参会人员及日期。</p><h3>三、时间待确认的记录</h3>${pending.length?pending.map(r=>`<p>${esc(r.title)}：${esc(r.topic)}</p>`).join(''):'<p>本周记录的会议日期均已补充。</p>'}<small>日期未知的记录单列，不计入已确定的本周会谈数量。</small><h3>四、需协助事项</h3><p>后续演示可能需要技术同事支持，具体参与安排待确认。</p></article><aside><div class="mf-paper"><h3>${reportConfirmed?'报告已确认':'只处理缺少的信息'}</h3>${reportConfirmed?'<p>Word 和 PDF 使用同一份确认内容。此原型只预览版式，不生成正式文件。</p>':`<p>已用你的会谈和后续事项填入模板，不用重新写一遍。</p>${pending.map(r=>`<label class="mf-field">${esc(r.title)}<input type="date" data-report-date="${r.id}" aria-label="补充 ${esc(r.title)} 的日期"></label>`).join('')}${pending.length?button('暂不补，保留时间待确认','ack-date'):''}`}</div><div class="mf-note">个人报告不会自动上报。未上报录音不进入主管和老板的中心。</div>${reportStale&&reportConfirmed?'<div class="mf-note mf-warn">来源有新变化。本页保留已确认内容，可修订为新草稿。</div>':''}${reportDateAcknowledged?'<div class="mf-note mf-warn">已保留“时间待确认”，其余内容可正常确认。</div>':''}</aside></div>`;}
  function centers(){const rows=snapshots.filter(s=>!s.removed);return heading(role==='sales'?'我已上报的会谈':'中心会谈',role==='sales'?'这里保留上报时的证据版本，个人区删改不影响它。':role==='manager'?'企业服务一组 · 仅已上报资料':'全公司 · 仅已上报资料')+(rows.length?rows.map(s=>row(s,true)).join(''):'<div class="mf-empty">暂无已上报记录。销售个人区资料不在这里展示。</div>');}
  function manager(){const rows=snapshots.filter(s=>!s.removed);return heading('陈经理，先看需要你参与的事','企业服务一组 · 基于中心已上报的会谈')+`<div class="mf-split"><section><h2>客户推进与关注</h2>${rows.length?rows.map(s=>`<article class="mf-issue"><small>${esc(s.customer||'客户待归属')} · 小林</small><h3>${esc(s.topic)}</h3><p class="mf-muted">下一步：${esc(s.promise)}</p><div class="mf-actions">${button('看会谈与依据','central-detail',s.id)}</div></article>`).join(''):'<div class="mf-empty">尚无团队上报。不会用个人区录音填充统计。</div>'}</section><aside class="mf-paper"><h3>需要确认的更正</h3><p>${requests.filter(q=>q.status==='pending').length} 条待处理</p>${button('查看更正申请','review','',true)}<h3>近期约定</h3><p>${rows.length?esc(rows[0].promise)+' · 日期未约定，不显示为逾期。':'暂无中心约定。'}</p><h3>培训复盘</h3><p>${rows.length?'已上报会谈中，下一步时间仍有待确认。':'暂无可复盘的上报会谈。'}</p><small>示例信号，点击会谈可核对依据。</small></aside></div>`;}
  function boss(){const rows=snapshots.filter(s=>!s.removed);return heading('公司会谈简报','全公司范围 · 仅汇总已上报资料')+`<div class="mf-split"><article class="mf-paper"><div class="mf-kicker">需要了解的变化</div><h2>${rows.length?'客户开始明确后续参与人员':'暂无可汇总的上报会谈'}</h2><p>${rows.length?esc(rows[0].customer||'待归属客户')+'：'+esc(rows[0].topic):'销售个人工作区不会因为老板身份而自动开放。'}</p>${rows.length?button('追溯原会谈','central-detail',rows[0].id):''}<h3>公司级资源协调</h3><p>现有示例尚未形成经确认的公司级决策请求。</p><h3>团队共性问题</h3><p>样本不足，先展示具体会谈信号，不生成销售排名或收入预测。</p></article><aside class="mf-paper"><h3>本次简报覆盖范围</h3><p>${rows.length} 场已上报会谈</p><small>这是资料覆盖数量，不代表公司全部销售活动。老板可继续查看全公司中心记录。</small><p>${button('查看中心会谈','center-records')}</p></aside></div>`;}
  function reviews(){return heading('更正申请','核对差异后确认，中心保留旧版本。')+(requests.length?requests.map((q,i)=>`<section class="mf-paper" style="margin-bottom:16px"><div class="mf-kicker">小林提交 · 基于中心 v${q.base}</div><h2>${esc(q.before.title)}</h2><div class="mf-meta"><span>原名称：${esc(q.before.title)}</span><span>拟改为：${esc(q.after.title)}</span><span>实际日期：${q.before.date||'未知'} → ${q.after.date||'未知'}</span><span>客户归属：${esc(q.before.customer||'未知')} → ${esc(q.after.customer||'未知')}</span></div><blockquote>${esc(q.reason)}</blockquote>${q.status==='pending'?button('确认更正，生成新版本','approve',String(i),true):`<div class="mf-note">${q.status==='approved'?'已确认，中心新版本已生成。':'当前版本已变化，请重新核对。'}</div>`}</section>`).join(''):'<div class="mf-empty">暂无更正申请。可切换为销售，从“已上报”申请一次更正。</div>');}
  function preview(format){return heading(`${format} 导出预览`,'本页演示确认内容与文档版式。正式文件生成尚未实现。',button('返回工作简报','report'))+`<article class="mf-paper" style="max-width:700px;margin:auto"><div class="mf-report-head"><h2>本周工作简报</h2><p>小林 · 11月9日—11月15日 · 已确认 v${reportVersion}</p></div><h3>本周客户推进</h3><p>${esc(frozenReport?frozenReport.text:reportText)}</p><h3>后续安排</h3><p>准备演示资料，等待客户确认参与人员和日期。</p><h3>时间待确认</h3>${(frozenReport?frozenReport.pending:[]).map(r=>`<p>${esc(r.title)}</p>`).join('')||'<p>无</p>'}<small>示例文档预览 · 不会把“预览成功”表示成已经下载 Word/PDF。</small></article>`;}
  function render(){root.querySelector('#mf-nav').innerHTML=labels().map(([key,text])=>`<button data-act="${key}" ${view===key?'aria-current="page"':''}>${text}${key==='review'&&requests.some(q=>q.status==='pending')?' · '+requests.filter(q=>q.status==='pending').length:''}</button>`).join('');root.querySelector('#mf-scope').textContent=role==='sales'?'小林 · 个人工作区':role==='manager'?'陈经理 · 企业服务一组':'王总 · 公司中心';roleInput.value=role;screen.innerHTML=view==='calls'?calls():view==='detail'?details(false):view==='central-detail'?details(true):view==='edit'?editing(false):view==='request'?editing(true):view==='submit'?submitting():view==='report'?report():view==='submitted'||view==='center-records'?centers():view==='center'?manager():view==='boss'?boss():view==='review'?reviews():view==='word'?preview('Word'):preview('PDF');if(globalThis.lucide)lucide.createIcons();}
  function upload(fileName){if(busy)return;busy=true;announce('正在演示自动整理；没有把文件上传或交给模型。');render();setTimeout(()=>{const id='u'+(records.length+1);records.unshift({id,title:'11月11日 下午上传的会议录音 · '+String(records.length+1),date:'',customer:'',upload:'11月11日 14:32',topic:'示例整理：客户关注审批流程，实际会谈日期与客户归属仍待确认。',promise:'准备介绍资料，尚未明确后续日期。',version:1,deleted:false});busy=false;announce('示例已自动保存，仅自己可见。你不需要再点“保存纪要”。');render();},900);}
  root.addEventListener('click',event=>{const target=event.target.closest('[data-act]');if(!target)return;const act=target.dataset.act,id=target.dataset.id;if(act==='save-edit'||act==='finish-submit'){const f=target.closest('form');if(f.reportValidity())f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return;}if(['calls','report','submitted','center','center-records','boss','review','word','pdf'].includes(act)){go(act);return;}if(['detail','central-detail','edit','request'].includes(act)){go(act,id);return;}if(act==='upload'){upload();return;}if(act==='reset'){records=seed();snapshots=[{...seed()[0],rev:1,submitted:'11月10日 17:00',removed:false}];requests=[];selected.clear();role='sales';view='calls';busy=false;reportConfirmed=false;reportDateAcknowledged=false;frozenReport=null;reportStale=false;reportVersion=0;reportText='星河制造确认了采购协作需求，希望技术负责人参加后续演示。演示日期仍待双方确认。';announce('演示已重置，未修改实际业务。');render();return;}if(act==='tab'){detailTab=id;render();return;}if(act==='evidence'){evidence=!evidence;render();return;}if(act==='promise-done'){announce('示例：已记录准备工作完成；等待客户确认日期的事项仍保留。');return;}if(act==='source'){go('detail','a');evidence=true;render();return;}if(act==='ack-date'){reportDateAcknowledged=true;announce('日期未补的记录保留为“时间待确认”，不阻塞报告。');render();return;}if(act==='new-report'){reportConfirmed=false;reportStale=false;go('report');return;}if(act==='confirm-report'){reportConfirmed=true;reportStale=false;reportVersion++;frozenReport={text:reportText,pending:records.filter(r=>!r.deleted&&!r.date).map(r=>({...r}))};announce('示例报告 v'+reportVersion+' 已确认。Word 与 PDF 预览共用这份内容；没有自动上报。');render();persist();return;}if(act==='delete'){if(reportConfirmed)reportStale=true;record(id).deleted=true;selected.delete(id);announce(snap(id)?'个人录音已删除；中心上报版本仍保留，可在“已上报”查看。':'个人录音已删除，未影响中心。可用“重新体验完整流程”恢复示例。');render();return;}if(act==='submit'){go('submit');return;}if(act==='approve'){const q=requests[Number(id)],s=snap(q.id);if(!s||s.rev!==q.base){q.status='conflict';render();return;}snapshots=snapshots.map(x=>x===s?{...x,removed:true,historical:true}:x);snapshots.push({...q.after,id:q.id,rev:s.rev+1,submitted:'11月11日 15:10',removed:false});q.status='approved';announce(`中心 v${s.rev+1} 已生成，旧版 v${s.rev} 保留。销售个人区没有被覆盖。`);render();return;}if(act==='remove-center'){go('remove-confirm',id);screen.innerHTML=heading('撤下中心记录','删除保留策略仍待确定；本原型仅模拟撤下，不执行永久清除。')+`<section class="mf-paper"><p>该录音可能被纪要、质检和报告引用。</p><div class="mf-actions">${button('返回，不处理','center-records')}${button('模拟主管撤下','remove-approved',id,true)}</div></section>`;return;}if(act==='remove-approved'){const s=snap(id);if(s)s.removed=true;go('center-records');announce('示例：中心记录已撤下；个人副本未被删除。');return;}});
  root.addEventListener('change',event=>{const t=event.target;if(t===roleInput){role=t.value;selected.clear();go(role==='sales'?'calls':role==='manager'?'center':'boss');return;}if(t.dataset.select){t.checked?selected.add(t.dataset.select):selected.delete(t.dataset.select);render();return;}if(t.id==='mf-file'&&t.files.length){upload(t.files[0].name);return;}if(t.dataset.reportDate){record(t.dataset.reportDate).date=t.value;reportConfirmed=false;reportText=records.filter(r=>!r.deleted&&r.date>='2026-11-09'&&r.date<='2026-11-15').map(r=>(r.customer||'客户待归属')+'：'+r.topic).join('\n');announce('已补充个人会谈日期；本周正文只纳入11月9日至15日的已知日期记录。');render();}});
  root.addEventListener('input',event=>{if(event.target.id==='mf-report-text'){reportText=event.target.value;reportConfirmed=false;}});
  root.addEventListener('submit',event=>{event.preventDefault();const form=event.target,data=new FormData(form);if(form.id==='mf-edit'){const r=record(activeId)||snap(activeId),after={...r,title:String(data.get('title')),date:String(data.get('date')),customer:String(data.get('customer'))};if(view==='request'){const s=snap(activeId);requests.push({id:activeId,base:s.rev,before:{...s},after,reason:String(data.get('reason')),status:'pending'});go('submitted');announce('更正申请已提交。切换到主管可核对差异；中心当前版本尚未改变。');}else{if(reportConfirmed)reportStale=true;Object.assign(r,after,{version:r.version+1});go('detail',r.id);announce('个人修改已保存。已上报的中心版本保持原样。');}return;}if(form.id==='mf-submit'){records.filter(r=>selected.has(r.id)&&!r.deleted).forEach(r=>{if(!r.customer)r.customer=String(data.get('customer-'+r.id));if(!snap(r.id))snapshots.push({...r,rev:1,submitted:'11月11日 15:00',removed:false});});selected.clear();go('submitted');announce('所选录音及其当前依据已进入中心。未选录音仍仅自己可见。');}});
  root.addEventListener('dragover',event=>{if(event.target.closest('#mf-drop'))event.preventDefault();});root.addEventListener('drop',event=>{if(event.target.closest('#mf-drop')){event.preventDefault();if(event.dataTransfer.files.length)upload(event.dataTransfer.files[0].name);}});
  const saved=window.openai?.widgetState?.modelContent;if(saved&&['sales','manager','boss'].includes(saved.role)){role=saved.role;view=role==='sales'?'calls':role==='manager'?'center':'boss';}
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--mf-row-space',stateDesign.comfortable?'21px':'13px');}});tweak.addToggle(stateDesign,'comfortable',{label:'更宽松的会谈行距'});}
})();
</script>
